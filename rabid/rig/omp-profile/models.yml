      - id: qwen3-8b-1cat
        name: Qwen3-8B (local, 1Cat-vLLM, 32K)
        reasoning: true
        input: [text]
        contextWindow: 32768
        maxTokens: 32768
        tokenizer: qwen3
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          maxTokensField: max_tokens
      - id: qwen3.8-27b-nvfp4-1cat
        name: Qwen3.8-27B NVFP4 (local, 1Cat-vLLM, 32K)
        reasoning: true
