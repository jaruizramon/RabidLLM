      - id: qwen3.8-27b
        name: Qwen3.8-27B MTP-Q4_K_M (local, 164K)
        compactionModel: deepseek/deepseek-flash
        reasoning: true
        input: [text, image]
        contextWindow: 163840
        maxTokens: 32768
