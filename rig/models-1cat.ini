; 1Cat-vLLM presets — the second engine on the V100.
;
; A separate file from models.ini on purpose: llama.cpp's router validates every key in
; every preset against its own option table and refuses the whole file on the first key
; it does not recognise ("option 'backend' not recognized in preset ..."), so a preset
; carrying vLLM flags cannot live in the file the router reads.  The manager parses both
; files and merges them into one model list, so ids, the UI and http://127.0.0.1:8080/v1
; are identical for both engines.
;
; Keys:
;   model      Hub repo id (fetched on first load) or a local directory of safetensors
;   backend    implicit here ("1cat"); accepted explicitly for symmetry with models.ini
;   ctx-size   → --max-model-len          dtype → --dtype (default float16)
;   vllm-<x>   → --<x>, e.g. vllm-gpu-memory-utilization = 0.85, vllm-max-num-seqs = 8,
;              vllm-enable-prefix-caching = true.  A bare flag takes an empty value.
;
; fp16 is the right dtype on Volta: bf16 checkpoints still load, but bf16 math runs
; through fp32 emulation there (~9 TFLOP/s against fp16's ~92, measured on this card).

[qwen2.5-0.5b-1cat]
model = Qwen/Qwen2.5-0.5B-Instruct
ctx-size = 8192
vllm-gpu-memory-utilization = 0.35
vllm-max-num-seqs = 4
tags = 0.5B,smoke

[qwen3-8b-1cat]
model = Qwen/Qwen3-8B
dtype = float16
ctx-size = 32768
vllm-gpu-memory-utilization = 0.85
vllm-max-num-seqs = 8
tags = 8B,dense,reasoning

; The fork's GDN/linear-attention layers compile a TileLang kernel on first use, and
; TileLang 0.1.10 decides "is there a GPU?" by locating nvcc: without CUDA_HOME it raises
; "No CUDA or HIP or MPS available on this system" at the first request, which reads like a
; kernel bug and is not one.  Any preset whose architecture has linear-attention layers
; needs this.  (The CUDA *runtime* comes from the torch wheel; this is the *toolkit*.)
[qwen3.8-27b-nvfp4-1cat]
env-CUDA_HOME = @HOME@/.local/opt/cuda-12.9-sm70
; nvcc 12.9 accepts a host compiler up to gcc 14 and this box's default is 15; TileLang
; invokes nvcc itself without -ccbin, so the flag has to arrive through nvcc's own env hook.
env-NVCC_APPEND_FLAGS = -ccbin /usr/bin/g++-14
; The 27B the GGUF card next door cannot serve here: vLLM reads GGUF, but this
; architecture resolves to the multimodal Qwen3.5 path, which needs the original
; tokenizer and then fails on a config-type mismatch (Qwen3_5TextConfig vs
; Qwen3_5Config).  The checkpoint's own NVFP4 weights sidestep all of that.
model = nvidia/Qwen3.8-27B-NVFP4
dtype = float16
ctx-size = 65536
; 21 GiB of mixed FP8/NVFP4 weights leave 4.68 GiB of the 32 GiB card for KV, and this
; hybrid architecture costs 64 KiB/token (16 of 64 layers keep KV: 2 x 4 kv heads x 256
; head_dim x 2 B; ~74 KiB/token effective after mamba-page alignment), i.e. 66,218 tokens
; of cache.  65,536 claims that whole budget for one long request (1.01x concurrency);
; 32768 would instead run two full-window requests.  The model is native 262,144.
vllm-gpu-memory-utilization = 0.90
vllm-max-num-seqs = 4
; The fork keeps its 4-bit gates at sm_75/89 until its SM70 backend is selected:
; this is the switch that admits Volta (QPN4/Marlin paths) instead of refusing.
env-VLLM_SM70_QUANT_BACKEND = turbomind
tags = 1cat,27B,nvfp4,reasoning

; The fork's GDN/linear-attention layers compile a TileLang kernel on first use, and
; TileLang 0.1.10 decides "is there a GPU?" by locating nvcc: without CUDA_HOME it raises
; "No CUDA or HIP or MPS available on this system" at the first request, which reads like a
; kernel bug and is not one.  Any preset whose architecture has linear-attention layers
; needs this.  (The CUDA *runtime* comes from the torch wheel; this is the *toolkit*.)
[qwen3.8-27b-fp8-1cat]
env-CUDA_HOME = @HOME@/.local/opt/cuda-12.9-sm70
; nvcc 12.9 accepts a host compiler up to gcc 14 and this box's default is 15; TileLang
; invokes nvcc itself without -ccbin, so the flag has to arrive through nvcc's own env hook.
env-NVCC_APPEND_FLAGS = -ccbin /usr/bin/g++-14
; The FP8 W8A16 alternative: verified working on this V100 (the fork logs
; "SM70 FP8 TurboMind W8A16 dense path enabled"), but 27 GiB of weights on a
; 32 GiB card leaves little for KV — expect a short context or a single sequence.
model = orcarouter/Qwen3.8-27B-Uncensored-FP8
dtype = float16
ctx-size = 8192
vllm-gpu-memory-utilization = 0.95
vllm-max-num-seqs = 1
env-VLLM_SM70_QUANT_BACKEND = turbomind
tags = 1cat,27B,fp8
