; llama-server router presets — one section per model on the V100.
;
; Section name = the model id clients send in the "model" field, so these are
; exactly the ids registered in ~/.omp/agent/models.yml and ~/.pi/agent/models.json.
; Keys are llama-server argument names without the leading dashes.
;
; Per-model flags come from ~/Desktop/local-qwen-on-v100.md (§5, §12, §20, §22);
; the router gives command-line arguments precedence over this file, which is why the
; router is started with nothing model-specific: --models-preset, --models-max 1 and
; --no-models-autoload, all three of which the manager passes itself.

; `backend = 1cat` presets live in models-1cat.ini instead of here: the router refuses
; any key it does not know, so vLLM flags cannot share this file.  The manager reads both.

version = 1

[*]
slot-save-path = @HOME@/.local/share/llama-v100/slots
; §5 recipe: everything that fits on one V100 at the model's native 256K window.
n-gpu-layers = 99
ctx-size = 262144
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
; Prompt-state cache in host RAM. The default 8192 cannot hold the state of a
; 140K+ context (8.3-8.9 GiB measured), so every aux request forced a full
; re-prefill. 24 GiB holds a full 262K state (~17 GiB) plus small entries.
cache-ram = 8192
; Three switches keep the V100 empty until a card is dropped, and all three are set:
; this one (no preload when the router starts), --no-models-autoload on the router's
; command line (a request naming an unloaded model is refused, not served by loading
; it), and the manager never calling /models/load on its own.  POST /models/load is
; the only thing that puts weights in VRAM.
load-on-startup = false
stop-timeout = 10
; Release the KV cache and the weights from the V100 after this many seconds with no
; request. Sleeping is what makes "the model is loaded" cost nothing while you are
; reading or thinking: a request wakes it again (§19). Disabled here: a >10-minute
; pause would otherwise drop the KV and pay a cold reload + full-context prefill.
sleep-idle-seconds = -1

[qwen3.8-27b]
model = @HOME@/models/Qwen3.8-27B-MTP-Q5_K_M.gguf
; The model is natively multimodal. The F16 projector is the one already proven
; with the Q4 build; keep it so image input stays wired.
mmproj = @HOME@/models/mmproj-Qwen3.8-27B-Uncensored-F16.gguf
ctx-size = 131072
; 128K total; the harness compacts at 100K, leaving 28K for image tokens.
; The GGUF carries its own MTP head (qwen35.nextn_predict_layers = 1, blk.64.nextn.*) and
; its own sampler recipe (temp 1.0 / top_p 0.95 / top_k 20), so no sidecar file is needed
; and llama.cpp's defaults never apply.  Q5 at 1K: depth 2 = 33.4 t/s (54% acceptance),
; depth 3 = 30.5 (43%), depth 4 = 29.1 (37%), depth 7 = 20.1 (22%). F16 KV + depth 2 = 34.6 t/s (56%).
cache-type-k = f16
cache-type-v = f16
spec-type = draft-mtp
spec-draft-n-max = 2
; Prior turns' <think> blocks are not carried in the prompt: they were ~a third of
; the live context. The archived copy is at /dev/shm/qwen-thoughts (omp-thoughts).
reasoning-preserve = off
tags = dense,27B,MTP-Q5_K_M

[qwen3.8-27b-uncensored]
model = @HOME@/models/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
ctx-size = 163840
; The GGUF carries the model's own MTP head (blk.64.nextn.* / qwen35.nextn_predict_layers),
; so llama.cpp can draft with it and verify in the same forward pass — the same mechanism
; qwen3.8-27b uses above.  Depth 3 is this model's measured knee: 28.4 -> 43.1 t/s at
; ~1.6K live (depth 2: 37.5, depth 4: 39.5) and 19.5-20.8 -> 28.6 at 50K live, at 73-83%
; draft acceptance.  Depth is a workload property, not a taste.
spec-type = draft-mtp
spec-draft-n-max = 3
reasoning-preserve = off
; The projector on disk is deliberately not passed, matching §12's "Not yet wired" open
; item — add `mmproj = @HOME@/models/mmproj-Qwen3.8-27B-Uncensored-F16.gguf` to this
; section to wire vision.
tags = dense,27B,Q4_K_M,abliterated

[nemotron-3-nano-30b]
model = @HOME@/models/Nemotron-3-Nano-30B-A3B-UD-Q5_K_XL.gguf
; NVIDIA ships no GGUF, so this is unsloth's UD-Q5_K_XL — the largest quant that fits
; (§20.4).  Sampling is NVIDIA's own for reasoning, temp 1.0 / top_p 1.0, and the file
; carries both.  The GGUF declares context_length 1048576 and it does load at 32,118 MiB,
; but that leaves 650 MiB on a 32 GiB card, so the [*] 262144 stands (NVIDIA's own
; --max-model-len); set `ctx-size = 1048576` here if a job needs the declared window more
; than it needs the headroom.  Only 6 of the 52 layers hold KV: 0.86 GiB at 256K.
tags = reasoning,moe,30B-A3B,UD-Q5_K_XL

[ornith-1.0-35b]
model = @HOME@/models/Ornith-1.0-35B-Q6_K.gguf
; Q6_K is the largest rung of the publisher's ladder that fits: 31,128 MiB resident at
; 262144 with q8_0 KV, i.e. 1.3 GiB of headroom (Q5_K_M, 23.0 GiB, is the roomier
; alternative if that ever bites).  Q8_0 (34.4 GiB) does not fit.  10 of 40 layers hold
; KV (2 heads x 256), which is what makes the 256K window affordable at 2.9 GiB.
; The publisher's sampler recipe (temp 1.0 / top_p 0.95 / top_k 20) travels in the GGUF.
tags = coder,reasoning,moe,35B-A3B,Q6_K

[qwen3.6-35b-a3b-q5-k-m]
model = @HOME@/models/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
; 182K total; the harness compacts at 144K, leaving 38K of image-prefill headroom.
ctx-size = 186368
mmproj = @HOME@/models/mmproj-Qwen3.6-35B-A3B-F16.gguf
; At 182K total (144K active + 38K image headroom) the Q5 weights + F16 projector
; leave ample free VRAM; a draft head is still not part of this preset.
; So: images, no speculative decoding (§22).
;
; Qwen publishes no GGUF of its own; ggml-org has Q4_K_M and Q8_0 only, so this is unsloth's
; imatrix UD ladder — the same source the rig uses for qwen3.8-27b.
;
; The trunk is ornith-1.0-35b's shape key for key (qwen35moe, 40 layers = 10 x (3 x Gated
; DeltaNet -> 1 x Gated Attention), 256 experts / 8 routed, head_count_kv 2, head_dim 256),
; so only 10 of the 40 layers grow a KV cache — 10.6 KiB/token at q8_0, i.e. ~1.88 GiB at
; 186368. The projector is F16 because the V100 has no bf16 tensors (§22).
;
; Sampling travels in the GGUF (temp 1.0 / top_p 0.95 / top_k 20 — Qwen's reasoning recipe,
; the numbers Ornith carries too); min-p is the one value the card publishes that the file is
; silent on, so stating it here keeps llama.cpp from sampling at its own 0.05.  Thinking is
; on by default in the template; `enable_thinking=false` and Qwen3.6's new
; `preserve_thinking` are per-request template kwargs, not preset flags (§22).
min-p = 0
tags = coder,reasoning,moe,35B-A3B,vision,Q5_K_M

[gemma-4-12b]
model = @HOME@/models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
mmproj = @HOME@/models/mmproj-gemma-4-12B-F16.gguf
; Gemma 4 12B Unified: 48 layers, 8 full-attention + 40 sliding-1024 layers,
; 8 KV heads, 256K native. Q4_K_XL is Unsloth's Dynamic 2.0 quant of Google's
; QAT checkpoint; the MTP drafter is a separate 242 MiB file and shares the
; target KV. q8_0 KV fits the full 262144 window in ~17 GiB total on the V100.
ctx-size = 262144
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-model = @HOME@/models/mtp-gemma-4-12B-it.gguf
spec-draft-ngl = 99
; Gemma 4 card: temperature 1.0 / top_p 0.95 / top_k 64.
temperature = 1.0
top-p = 0.95
top-k = 64
min-p = 0
reasoning-preserve = off
tags = agent,coder,reasoning,12B,vision,gemma4,Q4_K_XL

[gemma-4-26b-a4b]
model = @HOME@/models/gemma-4-26B-A4B-it-UD-Q6_K_XL.gguf
mmproj = @HOME@/models/mmproj-gemma-4-26B-A4B-F16.gguf
; Gemma 4 26B A4B: 25.2B total, 3.8B active, 30 layers (5 full + 25
; sliding-1024), 8 KV heads, K=V. Q6_K_XL is Unsloth's 21.7 GiB dynamic
; quant of the non-QAT BF16 model. With q8 KV the full 262144 window is
; ~30.4 GiB resident; the Q8 variant did not leave enough room for 256K.
ctx-size = 262144
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-model = @HOME@/models/mtp-gemma-4-26B-A4B-it.gguf
spec-draft-ngl = 99
temperature = 1.0
top-p = 0.95
top-k = 64
min-p = 0
reasoning-preserve = off
tags = agent,coder,reasoning,26B-A4B,vision,gemma4,Q6_K_XL

[nanbeige-4.3-33b-q4-k-m]
model = @HOME@/models/Nanbeige_Nanbeige4.3-33B-Q4_K_M.gguf
; Nanbeige4.3-33B is a dense 33.1B Llama: 52 blocks, 56 query / 8 KV heads,
; 512K native. The GGUF declares 52 blocks; 144/174 is not a layer count here.
; Q4_K_M is 20.8 GB; 166K total q4_0 KV is ~7.5 GB; 128K active.
; Measured 128K: 27.7 GiB resident. 166K leaves ~2 GiB for an MTP head.
ctx-size = 166000
n-gpu-layers = 99
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
jinja = true
temperature = 1.0
top-p = 0.95
top-k = 0
min-p = 0
reasoning-preserve = off
tags = agent,coder,reasoning,33B,nanbeige,Q4_K_M

[gpt-oss-20b-q4-k-m]
model = @HOME@/models/gpt-oss-20b-Q4_K_M.gguf
; OpenAI gpt-oss-20b: 21B total / 3.6B active, harmony, 131K native.
; Q4_K_M 11.6 GB; capped at the model's 131072 slot; 128K active threshold.
ctx-size = 131072
n-gpu-layers = 99
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
jinja = true
temperature = 1.0
top-p = 1.0
top-k = 0
min-p = 0
reasoning-preserve = off
tags = agent,reasoning,tools,20B-A3.6B,gpt-oss,Q4_K_M

[deepseek-r1-distill-14b-q4-k-m]
model = @HOME@/models/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
; DeepSeek-R1-Distill-Qwen-14B: 14.8B dense, 128K, R1 reasoning.
; Q4_K_M 9.0 GB; 128K q4_0 KV; all layers on V100.
ctx-size = 131072
n-gpu-layers = 99
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
jinja = true
temperature = 0.6
top-p = 0.95
top-k = 0
min-p = 0
reasoning-preserve = off
tags = reasoning,14B,deepseek,r1-distill,Q4_K_M

; =====================================================================
; RabidAI coherence presets (PLAN-presets-and-omp.md §2).
; One slot: only one of these loads at a time. `rabid-balanced` and
; `rabid-fast` use the Q5 text-only fallback (P0-B): the Q4_K_XL pack and
; the 35B F16 projector are not on disk, so no mmproj and no draft here.
; Replace their paths with the Q4 pack once it is fetched.
; =====================================================================

[rabid-deep]
model = @HOME@/models/Qwen3.8-27B-UD-Q4_K_M.gguf
ctx-size = 163840
; The measured baseline (UD) rather than the MTP-Q5_K_M pack. MTP depth 3 is
; the measured knee; prior thinking is offloaded to /dev/shm/qwen-thoughts.
spec-type = draft-mtp
spec-draft-n-max = 3
reasoning-preserve = off
tags = rabid,deep,coherence,27B,dense,MTP

[rabid-balanced]
model = @HOME@/models/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
; Q5 text-only: the projector is absent and Q5 cannot host vision + a draft.
; The harness also sends its own per-level budget; this is the server default.
reasoning-budget = 4096
min-p = 0
tags = rabid,balanced,35B-A3B,MoE,text,Q5_K_M

[rabid-fast]
model = @HOME@/models/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
reasoning-budget = 2048
temperature = 0.7
top-p = 0.8
top-k = 20
min-p = 0
tags = rabid,fast,regular,35B-A3B,MoE,text,Q5_K_M
