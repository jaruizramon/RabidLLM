; Stock-only cards — models whose architecture the PrismML router (b10709) predates.
;
; A preset here runs ~/.local/bin/llama-server-stock (mainline b11026) as a single-model
; server on the front-door port when dropped, instead of a router child.  Keys are the
; same llama.cpp flag names models.ini uses; the file's `backend` defaults to `stock` in
; the parser, which is what routes the card to this engine.  Only one engine owns the
; port at a time, exactly like the 1cat-vLLM engine (models-1cat.ini).
;
; No cards today: the one stock card, spark-x2.5-4b, had its weights removed from
; ~/models, so the stock engine stays idle until a card is added back here.

version = 1
