        input: [text, image]
        contextWindow: 186368
        maxTokens: 22528
        # Same 248,320-token Qwen3.5 vocabulary as qwen3.8-27b, so the qwen3 embedding fits.
        tokenizer: qwen3
        compat:
          supportsDeveloperRole: false
          # The template has no reasoning_effort branch at all — thinking is on unless
          # `enable_thinking` is false — so the knob cannot be offered: a harness that
          # believes it exists sends a value there is no branch to receive (§21.1).
          supportsReasoningEffort: false
          maxTokensField: max_tokens

      - id: gemma-4-12b
        name: Gemma 4 12B IT QAT UD-Q4_K_XL (local, 256K, vision, MTP)
        compactionModel: deepseek/deepseek-flash
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        maxTokens: 32768
        # No tokenizer key: Gemma 4's 262K vocab is not in the harness tokenizer set;
        # counting is approximate until a gemma4 embedding exists.
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          maxTokensField: max_tokens

      - id: gemma-4-26b-a4b
        name: Gemma 4 26B A4B IT UD-Q6_K_XL (local, 256K, vision, MTP)
        compactionModel: deepseek/deepseek-flash
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        maxTokens: 32768
        # Same Gemma 4 tokenizer gap; counts are approximate.
        # The override prompt carries <|think|>; enable_thinking makes the
        # template emit its control token at the system-prompt boundary.
        extraBody:
          chat_template_kwargs:
            enable_thinking: true
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          maxTokensField: max_tokens

      - id: gpt-oss-20b-q4-k-m
        name: GPT-OSS-20B Q4_K_M (local, 128K active / 131K total, CoT, tools)
        compactionModel: deepseek/deepseek-flash
        reasoning: true
        input: [text]
        supportsTools: true
        contextWindow: 131072
        maxContextWindow: 131072
        maxTokens: 32768
        compat:
